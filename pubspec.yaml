name: githubexplorer
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.3
  connectivity_plus: ^6.1.5
  go_router: ^15.1.2
  http: ^1.3.0
  path: ^1.9.1
  share_plus: ^10.1.4
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - images/github_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/github_icon.png"
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "images/github_icon.png"
  image_path_ios: "images/github_icon.png"
  remove_alpha_ios: true
